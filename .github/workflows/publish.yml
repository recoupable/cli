name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: npm exchanges this OIDC token for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + stay on the branch so the bump step can rebase + push.
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # Bump in the working tree only; it is committed after a successful publish
      # so a failed run never leaves an unpublished version on main.
      - name: Bump patch version
        id: bump
        run: echo "version=$(npm version patch --no-git-tag-version)" >> "$GITHUB_OUTPUT"

      - run: pnpm exec tsc --noEmit

      - run: pnpm build

      - run: pnpm test

      - name: Publish to npm
        run: npm publish

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
