name: Read-only npm token diagnosis

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing npm authorization without publication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base = 'https://registry.npmjs.org';
          const target = '@recoupable/cli';
          const token = process.env.NODE_AUTH_TOKEN;
          const read = async (path, authenticated = false) => {
            const response = await fetch(base + path, {
              headers: authenticated ? { Authorization: `Bearer ${token}` } : {},
              redirect: 'error', signal: AbortSignal.timeout(20000),
            });
            const body = await response.json().catch(() => ({}));
            return { status: response.status, body };
          };
          try {
            const pkg = await read('/@recoupable%2fcli');
            console.log(JSON.stringify({ check: 'public_package', http: pkg.status,
              latest: pkg.body['dist-tags']?.latest ?? null }));
            if (!token) {
              console.log(JSON.stringify({ check: 'authentication', result: 'secret_missing' }));
              process.exitCode = 1;
            } else {
              const identity = await read('/-/whoami', true);
              const message = JSON.stringify(identity.body).toLowerCase();
              console.log(JSON.stringify({ check: 'authentication', http: identity.status,
                authenticated: identity.status === 200 && typeof identity.body.username === 'string',
                expiry_or_revocation_reported: /expired|revoked/.test(message) }));
              if (identity.status === 200 && typeof identity.body.username === 'string') {
                const access = await read('/-/user/' + encodeURIComponent(identity.body.username) + '/package', true);
                const permission = access.body[target];
                console.log(JSON.stringify({ check: 'target_package_access', http: access.status,
                  permission: ['read-write', 'read-only'].includes(permission) ? permission : 'not_reported' }));
                if (access.status !== 200 || permission !== 'read-write') process.exitCode = 1;
              } else process.exitCode = 1;
            }
          } catch {
            console.log(JSON.stringify({ check: 'registry_request', result: 'transport_or_response_failure' }));
            process.exitCode = 1;
          }
          JS
